{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}WoxionChat - Feedback{% endblock %}

{% block content %}
<div class="main-content-scroll" style="max-width: 800px;">
    <!-- Page Header -->
    <div class="page-header-row" style="margin-bottom: 28px;">
        <div>
            <h1 class="page-heading">User Feedback</h1>
            <p class="page-subheading">Help us improve WoxionChat document analysis and retrieval accuracy.</p>
        </div>
    </div>

    <!-- Survey Card -->
    <div class="woxion-card" style="padding: 32px;">
        <div id="surveyAlert" class="woxion-alert" style="display: none;"></div>

        <form id="feedbackSurveyForm" onsubmit="handleFeedbackSubmit(event)">
            {% csrf_token %}
            <input type="hidden" id="feedbackUserId" value="{{ user_id }}">
            <input type="hidden" id="feedbackSessionId" value="{{ session_id }}">

            <!-- Question 1: Overall Satisfaction -->
            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" style="font-size: 0.95rem; margin-bottom: 10px;">
                    1. How satisfied are you with WoxionChat's answers and source citations?
                </label>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <label class="prompt-chip" style="cursor: pointer;">
                        <input type="radio" name="satisfaction" value="5" checked style="accent-color: var(--brand-yellow); margin-right: 6px;">
                        Very Satisfied (5★)
                    </label>
                    <label class="prompt-chip" style="cursor: pointer;">
                        <input type="radio" name="satisfaction" value="4" style="accent-color: var(--brand-yellow); margin-right: 6px;">
                        Satisfied (4★)
                    </label>
                    <label class="prompt-chip" style="cursor: pointer;">
                        <input type="radio" name="satisfaction" value="3" style="accent-color: var(--brand-yellow); margin-right: 6px;">
                        Neutral (3★)
                    </label>
                    <label class="prompt-chip" style="cursor: pointer;">
                        <input type="radio" name="satisfaction" value="2" style="accent-color: var(--brand-yellow); margin-right: 6px;">
                        Dissatisfied (2★)
                    </label>
                </div>
            </div>

            <!-- Question 2: Accuracy of OCR -->
            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" style="font-size: 0.95rem; margin-bottom: 10px;">
                    2. Did the OCR accurately capture text and tables from your uploaded documents?
                </label>
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <label class="prompt-chip" style="cursor: pointer;">
                        <input type="radio" name="ocr_accuracy" value="accurate" checked style="accent-color: var(--brand-yellow); margin-right: 6px;">
                        Yes, highly accurate
                    </label>
                    <label class="prompt-chip" style="cursor: pointer;">
                        <input type="radio" name="ocr_accuracy" value="minor_issues" style="accent-color: var(--brand-yellow); margin-right: 6px;">
                        Minor typos / formatting issues
                    </label>
                    <label class="prompt-chip" style="cursor: pointer;">
                        <input type="radio" name="ocr_accuracy" value="poor" style="accent-color: var(--brand-yellow); margin-right: 6px;">
                        Missing text / poor recognition
                    </label>
                </div>
            </div>

            <!-- Question 3: Comments -->
            <div class="form-group" style="margin-bottom: 28px;">
                <label class="form-label" for="feedbackComment" style="font-size: 0.95rem;">
                    3. What features or improvements would you like to see next?
                </label>
                <textarea id="feedbackComment" class="form-control-warm" rows="4" placeholder="Your thoughts, bug reports or suggestions..."></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px;">
                <a href="{% url 'dashboard' %}" class="btn-link-muted" style="text-decoration: none;">Cancel</a>
                <button type="submit" class="btn-primary-yellow" id="submitFeedbackBtn">
                    <i class="fas fa-paper-plane"></i>
                    <span>Submit Feedback</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function handleFeedbackSubmit(e) {
    e.preventDefault();
    const alertBox = document.getElementById('surveyAlert');
    const submitBtn = document.getElementById('submitFeedbackBtn');
    submitBtn.disabled = true;

    const satisfaction = document.querySelector('input[name="satisfaction"]:checked')?.value || "5";
    const ocr_accuracy = document.querySelector('input[name="ocr_accuracy"]:checked')?.value || "accurate";
    const comments = document.getElementById('feedbackComment').value.trim();
    const user_id = document.getElementById('feedbackUserId').value;
    const session_id = document.getElementById('feedbackSessionId').value;

    try {
        const res = await fetch("{% url 'api_submit_feedback' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                user_id: user_id,
                session_id: session_id,
                survey_data: {
                    satisfaction: satisfaction,
                    ocr_accuracy: ocr_accuracy,
                    comments: comments
                }
            })
        });

        alertBox.style.display = 'flex';
        if (res.ok) {
            alertBox.className = 'woxion-alert success';
            alertBox.innerHTML = '<i class="fas fa-check-circle"></i> Thank you! Your feedback has been submitted successfully.';
            document.getElementById('feedbackSurveyForm').reset();
        } else {
            alertBox.className = 'woxion-alert error';
            alertBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Failed to submit feedback. Please try again.';
        }
    } catch (err) {
        alertBox.style.display = 'flex';
        alertBox.className = 'woxion-alert error';
        alertBox.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Network error submitting feedback.';
    } finally {
        submitBtn.disabled = false;
    }
}
</script>
{% endblock %}
